name: Moodle Plugin CI

on:
  push:
    branches: ['test-non-code-action-*']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  moodle-plugin-ci:
    uses: scha-ms/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@21fe0d6dae32d188c7c159c127a871bfb86fa5e4
    with:
      moodle-core-branch: MOODLE_501_STABLE
      pr-check-body-contains: CI-TEST
      non-code-paths: |
        README.md
        CHANGES.md
        docs/action-test-guide.md
    secrets:
      GENERIC_USERNAME_1: ${{ secrets.GENERIC_USERNAME_1 }}
      GENERIC_PASSWORD_1: ${{ secrets.GENERIC_PASSWORD_1 }}
      GENERIC_USERNAME_2: ${{ secrets.GENERIC_USERNAME_2 }}
      GENERIC_PASSWORD_2: ${{ secrets.GENERIC_PASSWORD_2 }}
